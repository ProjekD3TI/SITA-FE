<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/images/d3ti-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;
      0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;
      1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>Portal D3 TI UNS</title>
    <script>
      (function () {
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', '/env.txt', false);
          xhr.send(null);
          if (xhr.status === 200 && xhr.responseText) {
            window.__ENV__ = window.__ENV__ || {};
            var lines = xhr.responseText.split('\n');
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i].trim();
              if (line && line.indexOf('#') !== 0) {
                var eqIdx = line.indexOf('=');
                if (eqIdx !== -1) {
                  var key = line.substring(0, eqIdx).trim();
                  var val = line.substring(eqIdx + 1).trim();
                  if (
                    (val.charAt(0) === '"' && val.charAt(val.length - 1) === '"') ||
                    (val.charAt(0) === "'" && val.charAt(val.length - 1) === "'")
                  ) {
                    val = val.slice(1, -1);
                  }
                  window.__ENV__[key] = val;
                }
              }
            }
          }
        } catch (e) {
          // Fallback to build-time env if /env.txt is not available
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
