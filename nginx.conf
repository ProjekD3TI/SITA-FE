server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Izinkan akses folder .well-known (untuk verifikasi SSL/ACME challenge jika diperlukan)
    location ^~ /.well-known/ {
        allow all;
    }

    # Blokir akses ke file env.txt dan variasi file environment
    location ~* (^|/)(env\.txt|\.env) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blokir akses ke semua file dan folder tersembunyi (dotfiles seperti .git, .env, dll)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # SPA routing fallback ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
