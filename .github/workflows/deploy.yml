name: 🚀 CI/CD Deploy with Docker Compose

on:
  push:
    branches:
      - main
      - tugas-akhir
  workflow_dispatch:

jobs:
  deploy:
    name: 🐳 Deploy to Self-Hosted Server
    runs-on: self-hosted

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Environment (.env)
        run: |
          echo "Menghubungkan file .env dari $HOME/app-config/fe/.env..."
          if [ -f "$HOME/app-config/fe/.env" ]; then
            ln -sf "$HOME/app-config/fe/.env" .env
            echo "✅ Symlink .env berhasil dibuat dari ~/app-config/fe/.env"
          elif [ -f .env ]; then
            echo "ℹ️ ~/app-config/fe/.env tidak ditemukan, menggunakan .env yang sudah ada di direktori kerja."
          else
            echo "❌ ERROR: File .env tidak ditemukan di $HOME/app-config/fe/.env maupun di direktori kerja!"
            echo "Pastikan folder ~/app-config/fe/ sudah dibuat dan file .env sudah di-upload."
            exit 1
          fi

      - name: 🏗️ Build & Run Docker Containers
        run: |
          echo "Menjalankan docker compose up..."
          docker compose up -d --build

      - name: ⏳ Wait for Containers to be Ready
        run: |
          echo "Menunggu layanan frontend siap..."
          sleep 5

      - name: 🔍 Check Container Status
        run: |
          docker compose ps

      - name: 🧹 Cleanup Dangling Docker Images
        if: always()
        run: |
          echo "Membersihkan image Docker yang tidak terpakai..."
          docker image prune -f
